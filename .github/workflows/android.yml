name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/LASU-Student-Portal-${{ github.run_number }}.apk"
          ls -lh artifacts

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LASU-Student-Portal-APK
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" artifacts/*.apk \
            --title "LASU Student Portal — Android app" \
            --notes "Installable Android build of the LASU Islamic Studies Education student portal (matric 230125013). Download the .apk below, then open it on your phone and allow installation from this source."
